# ==========================================
# EA Designer Configuration
# ==========================================
# You can configure the ports used by the application by pointing Docker Compose to a config file.
# We have provided a 'config.env' file. To use it, start the application with the following command:
#
#   docker compose --env-file config.env up -d --build
#
# If you need to change a port, edit the 'config.env' file and re-run the command above (no
# rebuild needed - just a restart, since the frontend proxies /api to the backend at container
# start rather than baking its address in at build time). Alternatively, override ports directly:
#   APP_FRONTEND_PORT=8080 APP_BACKEND_PORT=5000 docker compose up -d
# ==========================================

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eadesigner
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ea-designer-backend:local
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eadesigner
      POSTGRES_HOST: db
      PORT: ${APP_BACKEND_PORT:-4001}
    ports:
      - "${APP_BACKEND_PORT:-4001}:${APP_BACKEND_PORT:-4001}"
    depends_on:
      - db

  frontend:
    image: ea-designer-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Substituted into nginx's /api reverse-proxy config at container start (see
      # nginx.conf.template) - this is an internal Docker-network port, unrelated to whatever
      # host port the app is actually reached on.
      BACKEND_INTERNAL_PORT: ${APP_BACKEND_PORT:-4001}
    ports:
      - "${APP_FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
